name: CMake Database Linux Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Generation Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison m4 flex

    - name: Verify Tools
      run: |
        gcc --version
        g++ --version
        m4 --version
        flex --version

    - name: Configure CMake
      run: |
        mkdir build_test
        cd build_test
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/default-gcc.toolchain.cmake ..

    - name: Build Project
      run: |
        cd build_test
        make -j$(nproc)
