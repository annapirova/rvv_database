name: RISC-V RVV 1.0 Build & Simulation via QEMU

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  riscv-build:
    runs-on: ubuntu-24.04 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install RISC-V Cross-Compiler & QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-riscv64-linux-gnu \
          g++-riscv64-linux-gnu \
          qemu-user \
          qemu-user-static \
          build-essential \
          cmake \
          bison \
          wget \
          tar

    - name: Build and Install GNU M4
      run: |
        mkdir -p $HOME/.local/bin
        cd /tmp
        wget https://gnu.org
        tar -xf m4-1.4.19.tar.gz
        cd m4-1.4.19
        ./configure --prefix=$HOME/.local
        make -j$(nproc)
        make install
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build and Install Flex
      run: |
        cd /tmp
        wget https://github.com
        tar -xf flex-2.6.4.tar.gz
        cd flex-2.6.4
        M4=$HOME/.local/bin/m4 ./configure --prefix=$HOME/.local
        make -j$(nproc)
        make install

    - name: Configure QEMU Environment Variables
      run: |
        echo "QEMU_CPU=rv64,v=true,vext_spec=v1.0" >> $GITHUB_ENV
        echo "QEMU_LD_PREFIX=/usr/riscv64-linux-gnu" >> $GITHUB_ENV

    - name: Configure CMake for RISC-V
      run: |
        export M4=$HOME/.local/bin/m4
        mkdir build_riscv
        cd build_riscv
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/riscv64-1p0-gcc.toolchain.cmake ..

    - name: Build Project
      run: |
        export M4=$HOME/.local/bin/m4
        cd build_riscv
        make -j$(nproc)

